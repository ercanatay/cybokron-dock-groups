# CI for Cybokron Dock Groups (macOS 14+ menu bar app, Swift 6 tools / Swift 5 language mode).
# Runs on macos-26 runners (Xcode 26+ toolchain). Runs the DockGroupsCore unit tests with SwiftPM and Xcode, and builds the ad hoc signed .app.
# For v* tags, the release job builds a Developer ID signed, notarized and stapled DMG for a draft release.
# Docs: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  swiftpm:
    name: SwiftPM test & app build
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        # The app needs the Xcode 26+ toolchain (App Intents const-values flags); pick the newest
        # Xcode installed on the runner instead of pinning a version folder.
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Run unit tests
        run: scripts/test.sh

      - name: Build universal release app
        env:
          UNIVERSAL: "1"
        run: scripts/build-app.sh release

      - name: Zip app bundle
        run: |
          cd build/release
          ditto -c -k --keepParent "Cybokron Dock Groups.app" "Cybokron-Dock-Groups.zip"

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cybokron-Dock-Groups
          path: build/release/Cybokron-Dock-Groups.zip
          retention-days: 14

  xcode:
    name: Xcode build & test
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        # The app needs the Xcode 26+ toolchain (App Intents const-values flags); pick the newest
        # Xcode installed on the runner instead of pinning a version folder.
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      - name: Build (Debug)
        run: |
          xcodebuild -project CybokronDockGroups.xcodeproj \
            -scheme CybokronDockGroups \
            -configuration Debug \
            -destination 'platform=macOS' \
            build

      - name: Test
        run: |
          xcodebuild -project CybokronDockGroups.xcodeproj \
            -scheme CybokronDockGroups \
            -destination 'platform=macOS' \
            test

  release:
    # Runs for v* tags only: builds the universal DMG, signs the app and the DMG with the Developer ID
    # Application certificate, notarizes and staples the DMG, and attaches it to a
    # draft GitHub release. Needs a macos-26 runner (Xcode 26+ toolchain).
    name: Release DMG
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: macos-26
    permissions:
      contents: write
    env:
      # SHA-1 of the Developer ID Application certificate; pins the identity
      # build-app.sh and make-dmg.sh sign with.
      CODESIGN_IDENTITY: 5113D3C4DEA9F1F9C082E516112B89E58BAA5111

    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      - name: Run unit tests
        run: scripts/test.sh

      - name: Import Developer ID certificate
        env:
          CERT_P12_BASE64: ${{ secrets.APPLE_DEVID_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_DEVID_CERT_PASSWORD }}
        run: |
          SIGNING_KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          CERT="$RUNNER_TEMP/devid.p12"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          (umask 077; printf '%s' "$CERT_P12_BASE64" | tr -d '\r\n ' | base64 --decode > "$CERT")
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$SIGNING_KEYCHAIN"
          security set-keychain-settings -lut 21600 "$SIGNING_KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$SIGNING_KEYCHAIN"
          security import "$CERT" -k "$SIGNING_KEYCHAIN" -f pkcs12 -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$CERT"
          # Developer ID intermediates, in case the runner or the .p12 lacks the chain.
          for ca in DeveloperIDCA DeveloperIDG2CA; do
            { curl -fsSL "https://www.apple.com/certificateauthority/$ca.cer" -o "$RUNNER_TEMP/$ca.cer" \
                && security import "$RUNNER_TEMP/$ca.cer" -k "$SIGNING_KEYCHAIN"; } \
              || echo "::warning::Could not import the $ca intermediate certificate"
          done
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASSWORD" "$SIGNING_KEYCHAIN" > /dev/null
          # Put the keychain first in the search list so codesign finds the identity.
          existing=()
          while IFS= read -r keychain; do
            existing+=("$(echo "$keychain" | xargs)")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$SIGNING_KEYCHAIN" "${existing[@]}"
          IDENTITIES="$(security find-identity -v -p codesigning "$SIGNING_KEYCHAIN")"
          grep -q "$CODESIGN_IDENTITY" <<< "$IDENTITIES" \
            || { echo "::error::Signing identity $CODESIGN_IDENTITY not found in the imported certificate"; exit 1; }

      - name: Build signed universal DMG
        # CODESIGN_IDENTITY (job env) makes build-app.sh sign the app with the hardened runtime and a
        # secure timestamp, and make-dmg.sh sign the DMG.
        run: |
          scripts/make-dmg.sh
          VERSION="$(plutil -extract CFBundleShortVersionString raw "build/release/Cybokron Dock Groups.app/Contents/Info.plist")"
          DMG="build/release/Cybokron-Dock-Groups-$VERSION-universal.dmg"
          test -f "$DMG"
          echo "DMG=$DMG" >> "$GITHUB_ENV"

      - name: Notarize DMG
        timeout-minutes: 95
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.APPLE_ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
        run: |
          ASC_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          (
            umask 077
            if [[ "$ASC_KEY_P8_BASE64" == -----BEGIN* ]]; then
              printf '%s\n' "$ASC_KEY_P8_BASE64" > "$ASC_KEY_PATH"   # stored as plain PEM
            else
              printf '%s' "$ASC_KEY_P8_BASE64" | tr -d '\r\n ' | base64 --decode > "$ASC_KEY_PATH"
            fi
          )
          chmod 600 "$ASC_KEY_PATH"
          RESULT="$RUNNER_TEMP/notarization.json"
          # Notarization usually takes 5–30 minutes; wait up to 90.
          xcrun notarytool submit "$DMG" \
            --key "$ASC_KEY_PATH" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" \
            --wait --timeout 90m --output-format json > "$RESULT" || true
          cat "$RESULT"
          STATUS="$(plutil -extract status raw "$RESULT" 2>/dev/null || echo unknown)"
          SUBMISSION_ID="$(plutil -extract id raw "$RESULT" 2>/dev/null || true)"
          if [[ "$STATUS" != "Accepted" ]]; then
            if [[ -n "$SUBMISSION_ID" ]]; then
              xcrun notarytool log "$SUBMISSION_ID" \
                --key "$ASC_KEY_PATH" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" || true
            fi
            echo "::error::Notarization status: $STATUS"
            exit 1
          fi

      - name: Staple and verify DMG
        env:
          EXPECTED_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          codesign --verify --strict --verbose=2 "$DMG"
          SIGNATURE="$(codesign -dv --verbose=2 "$DMG" 2>&1)"
          echo "$SIGNATURE"
          grep -q "^TeamIdentifier=$EXPECTED_TEAM_ID$" <<< "$SIGNATURE" \
            || { echo "::error::DMG is not signed by team $EXPECTED_TEAM_ID"; exit 1; }
          spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG"
          # The app inside must pass Gatekeeper too.
          MOUNT="$(mktemp -d)"
          hdiutil attach "$DMG" -readonly -nobrowse -mountpoint "$MOUNT" > /dev/null
          trap 'hdiutil detach "$MOUNT" -quiet || true' EXIT
          APP="$MOUNT/Cybokron Dock Groups.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          SIGNATURE="$(codesign -dv --verbose=2 "$APP" 2>&1)"
          echo "$SIGNATURE"
          grep -q "^TeamIdentifier=$EXPECTED_TEAM_ID$" <<< "$SIGNATURE" \
            || { echo "::error::App is not signed by team $EXPECTED_TEAM_ID"; exit 1; }
          spctl --assess --type execute --verbose=2 "$APP"

      - name: Clean up signing material
        if: ${{ always() }}
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/devid.p12"

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          files: build/release/*.dmg
          draft: true
          generate_release_notes: true
