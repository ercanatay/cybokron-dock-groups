# CI for Cybokron Dock Groups (macOS 14+ menu bar app, Swift 6 tools / Swift 5 language mode).
# Runs on macos-26 runners (Xcode 26+ toolchain). Runs the DockGroupsCore unit tests with SwiftPM and Xcode, and builds the ad hoc signed .app.
# Docs: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  swiftpm:
    name: SwiftPM test & app build
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        # The app needs the Xcode 26+ toolchain (App Intents const-values flags); pick the newest
        # Xcode installed on the runner instead of pinning a version folder.
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Run unit tests
        run: scripts/test.sh

      - name: Build universal release app
        env:
          UNIVERSAL: "1"
        run: scripts/build-app.sh release

      - name: Zip app bundle
        run: |
          cd build/release
          ditto -c -k --keepParent "Cybokron Dock Groups.app" "Cybokron-Dock-Groups.zip"

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cybokron-Dock-Groups
          path: build/release/Cybokron-Dock-Groups.zip
          retention-days: 14

  xcode:
    name: Xcode build & test
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        # The app needs the Xcode 26+ toolchain (App Intents const-values flags); pick the newest
        # Xcode installed on the runner instead of pinning a version folder.
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      - name: Build (Debug)
        run: |
          xcodebuild -project CybokronDockGroups.xcodeproj \
            -scheme CybokronDockGroups \
            -configuration Debug \
            -destination 'platform=macOS' \
            build

      - name: Test
        run: |
          xcodebuild -project CybokronDockGroups.xcodeproj \
            -scheme CybokronDockGroups \
            -destination 'platform=macOS' \
            test

  release:
    # Runs for v* tags only: builds the universal DMG and attaches it to a draft GitHub release.
    # Needs a macos-26 runner (Xcode 26+ toolchain).
    name: Release DMG
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: macos-26
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      - name: Run unit tests
        run: scripts/test.sh

      - name: Build universal DMG
        run: scripts/make-dmg.sh

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          files: build/release/*.dmg
          draft: true
          generate_release_notes: true
