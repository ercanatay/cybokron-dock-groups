name: Feature request
description: Suggest an idea or improvement for Cybokron Dock Groups.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        For open-ended ideas you'd like to discuss first, the [Ideas category in Discussions](https://github.com/ercanatay/cybokron-dock-groups/discussions/categories/ideas) is a great place to start.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what makes it hard today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should it work? Mockups and examples are welcome.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Menu bar
        - Group management window
        - Open All / launching
        - Dock tiles
        - Launcher popup
        - Keyboard shortcuts
        - Siri / Shortcuts
        - Other
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
